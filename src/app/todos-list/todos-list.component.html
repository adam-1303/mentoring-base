<app-create-todos-form (createTodos)="createTodos($event)"></app-create-todos-form>

<div class="todos">
   <div *ngFor="let todo of todosService.todosSubjest | async " >
      <app-todo-card 
         [todo]="todo" 
         (deleteTodo)="deleteTodo($event)"
         (editTodo)="editTodo($event)">
      </app-todo-card>
   </div>
</div>
