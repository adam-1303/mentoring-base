<div class="todos">
   <p>ТЕКСТ ЗАДАЧИ</p>
   <p>{{todo.title | truncateCharacters: 20}}</p>
   <p>АВТОР ЗАДАЧИ</p>
   <p>{{todo.userId}}</p>
   <p>ЗАДАЧА ЗАВЕРШЕНА</p>
   <p>{{todo.completed ? 'ДА' : 'НЕТ'}}</p>
   <button (click)="onDeleteTodo(todo.id)">УДАЛИТЬ ЗАДАЧУ</button>
   <button (click)="openTodo()">РЕДАКТИРОВАТЬ ЗАДАЧУ</button>
</div>
