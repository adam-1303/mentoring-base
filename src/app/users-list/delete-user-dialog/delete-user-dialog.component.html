<mat-dialog-content>
  <p>Вы действительно хотите удалить пользователя <strong>{{ data.userName}}</strong></p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onConfirm()">Нет</button>
  <button mat-button color="warn" (click)="onCancel()">Да</button>
</mat-dialog-actions>
